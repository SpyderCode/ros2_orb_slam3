%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters for DJI Tello Drone
# Configuration file for ORB-SLAM3 Monocular mode
#--------------------------------------------------------------------------------------------

File.version: "1.0"

Camera.type: "PinHole"

# Tello Camera calibration parameters
# Resolution: 960x720
# Focal length: ~921.9 pixels (both fx and fy)
# Principal point: (480.5, 360.5) - center of image
Camera1.fx: 921.9
Camera1.fy: 921.9
Camera1.cx: 480.5
Camera1.cy: 360.5

# Distortion coefficients (Tello has minimal distortion after rectification)
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

# Image resolution
Camera.width: 960
Camera.height: 720

# No resizing for Tello
Camera.newWidth: 960
Camera.newHeight: 720

# Camera frames per second (Tello streams at ~30 fps, but we process at 20)
Camera.fps: 20

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
# tello_dji_node publishes bgr8 encoding — must be 0
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# ORB Parameters
# Tuned for indoor environments typical of Tello drone operation
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
# Reduced from default 1000 to 800 for faster processing on smaller drone images
ORBextractor.nFeatures: 800

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Lower thresholds for indoor environments with potentially lower contrast
ORBextractor.iniThFAST: 15
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
